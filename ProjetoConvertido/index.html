<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrocaJá — login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand"><span class="t">Troca</span><span class="j">Já</span></div>

      <h1>Entrar</h1>
      <p class="auth-subtitle">Acesse sua conta e continue negociando.</p>

      <form class="auth-form" action="home.html" method="get">
        <div class="field-row">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="seu@email.com" />
        </div>

        <div class="field-row">
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Digite sua senha" />
        </div>

        <div class="auth-actions">
          <button class="btn btn-primary btn-block" type="submit">Login</button>
          <button class="btn btn-outline btn-block auth-ghost" type="button" onclick="window.location.href='home.html'">Voltar para a home</button>
        </div>
      </form>

      <div class="auth-divider">ou</div>

      <p class="auth-link-row">
        Ainda não tem conta?
        <a href="registro.html">Registre-se</a>
      </p>
    </div>
  </div>
</body>
</html>
